<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임전공 학생회 부서 안내</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    .title {
      font-size: 2.0em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .additional-items table {
      margin: 0 auto;
      border-collapse: collapse;
    }
    .additional-items td {
      padding: 3px 5px;
      vertical-align: middle;
    }
    .additional-items .first-letter {
      text-align: right;
      padding-right: 8px;
      font-weight: bold;
    }
    .additional-items .rest-text {
      text-align: left;
    }
    .container {
      width: 80%;
      max-width: 600px;
    }
    .container img {
      width: 20%;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .department {
      background-color: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }
    h2 {
      color: #333;
    }
    p {
      color: #666;
    }
  </style>
</head>
<body>
  <br><br><br><br><br>
  <div class="title">게임전공 학생회 부서 안내</div>
  <div class="additional-items">
    <table>
      <tr>
        <td class="first-letter">*</td>
        <td class="rest-text">냉장고, 프린터 등 과방 관리</td>
      </tr>
      <tr>
        <td class="first-letter">*</td>
        <td class="rest-text">학생회 LT 진행</td>
      </tr>
      <tr>
        <td class="first-letter">*</td>
        <td class="rest-text">과 행사 주도</td>
      </tr>
      <tr>
        <td class="first-letter">*</td>
        <td class="rest-text">학생 복지 증진</td>
      </tr>
    </table>
  </div>
  <div class="container">
    <div class="department">
      <h2>관리부</h2>
      <p><strong>부장</strong> <span class="manager-name">23 유재민</span></p>
      <p>강의실 소프트웨어 및 하드웨어, 과방 와이파이 등의 장비 관리</p>
    </div>
    <div class="department">
      <h2>기획부</h2>
      <p><strong>부장</strong> <span class="manager-name">21 김정형</span></p>
      <p>축제, 시험 기간 및 방학 이벤트 등의 학과 행사 기획</p>
    </div>
    <div class="department">
      <h2>총무부</h2>
      <p><strong>부장</strong> <span class="manager-name">22 조강현</span></p>
      <p>이벤트 상품, MT, 개강/종강 파티 예산 편성 및 관리, 학생회 회의 서기</p>
    </div>
    <div class="department">
      <h2>홍보부</h2>
      <p><strong>부장</strong> <span class="manager-name">21 조정훈</span></p>
      <p>카드 뉴스 제작, 학과 공식 인스타그램 관리</p>
    </div>
  </div>
</body>
</html>
