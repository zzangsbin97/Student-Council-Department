<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임전공 학생회 부서 안내</title>
    <style>
        /* 전체 페이지 스타일 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* 제목 스타일 */
        .title {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        /* 컨테이너: 부서 블럭과 이미지 정렬 */
        .container {
            width: 80%;
            max-width: 600px; /* 부서 블록과 같은 최대 너비 */
        }

        /* 이미지 스타일 */
        .container img {
            width: 20%; /* 컨테이너 크기의 60% */
            max-width: 100%; /* 부모(.container)의 폭을 넘지 않도록 */
            height: auto; /* 가로세로 비율 유지 */
            display: block;
            margin: 0 auto;
        }

        /* 부서별 섹션 스타일 */
        .department {
            background-color: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>

    <br><br><br><br><br>
    <div class="title">게임전공 학생회 부서 안내</div>
    <br>

    <div class="container">
        <img src="https://drive.google.com/uc?export=view&id=1LAsI8c2f962G8JqieRrpkdBvUarE9sld" alt="SMUGame">

    </div>

    <div class="container">
        <div class="department">
            <h2>관리부</h2>
            <p><strong>부장</strong> <span class="manager-name">23 유재민</span></p>
            <p>강의실 소프트웨어 및 하드웨어, 과방 와이파이 등의 장비 관리</p>
        </div>

        <div class="department">
            <h2>기획부</h2>
            <p><strong>부장</strong> <span class="manager-name">21 김정형</span></p>
            <p>축제, 시험 기간 및 방학 이벤트 등의 학과 행사 기획</p>
        </div>

        <div class="department">
            <h2>총무부</h2>
            <p><strong>부장</strong> <span class="manager-name">22 조강현</span></p>
            <p>이벤트 상품, MT, 개강/종강 파티 예산 편성 및 관리, 학생회 회의 서기</p>
        </div>

        <div class="department">
            <h2>홍보부</h2>
            <p><strong>부장</strong> <span class="manager-name">21 조정훈</span></p>
            <p>카드 뉴스 제작, 학과 공식 인스타그램 관리</p>
        </div>
    </div>

</body>
</html>
